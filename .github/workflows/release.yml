name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: quarry-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny unsound --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0235 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0190 --ignore RUSTSEC-2026-0221 --ignore RUSTSEC-2024-0429

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Start MySQL and Redis
        run: docker compose -f docker-compose.local-test-services.yml up -d mysql redis

      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if docker exec quarry-mysql mysqladmin ping -h localhost -uroot -pquarry --silent; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Wait for Redis
        run: |
          for attempt in {1..30}; do
            if docker exec quarry-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify release candidate
        run: |
          bun run check:ci
          bun run check:docs
          bun run audit:dependencies
          bun run test:run
          QUARRY_MYSQL_INTEGRATION=1 bun run vitest run src/app/core/integration/mysql-provider.integration.spec.ts
          QUARRY_REDIS_INTEGRATION=1 cargo test --manifest-path src-tauri/Cargo.toml exercises_the_native_provider_against_a_live_server_when_requested
          bun run test:e2e
          bun run build
          bun run build:landing
          bun run test:landing
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Stop provider test services
        if: always()
        run: docker compose -f docker-compose.local-test-services.yml down

  build:
    needs: verify
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
            arch: x64
          - platform: windows-latest
            args: ''
            rust_target: ''
            arch: x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # tauri-action builds and uploads the DMG/EXE/MSI installers.
      # includeUpdaterJson is disabled because tauri-action repacks the macOS .tar.gz
      # (breaking its signature) before it tries to find it. We handle latest.json ourselves.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Quarry ${{ github.ref_name }}'
          releaseBody: |
            See the full changelog in the commit history.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # macOS: tauri-action repacks the .app into a fresh tar.gz right before upload,
      # which invalidates the Tauri-CLI-generated signature AND deletes the original
      # .sig (so there's nothing valid to "restore"). Fix: re-sign the final repacked
      # bundle ourselves — the one tauri-action already uploaded — using the same
      # private key, then upload that matching signature.
      - name: Re-sign macOS updater bundle
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Quarry.app.tar.gz"
          ARCH="${{ matrix.arch }}"
          TAG="${{ github.ref_name }}"

          # `tauri build` reads TAURI_SIGNING_PRIVATE_KEY directly and tolerates a
          # trailing newline, but `signer sign -k`'s base64 decoder does not — strip it.
          KEY=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\n\r')
          bunx tauri signer sign -k "$KEY" -p "" "$BUNDLE"

          cp "$BUNDLE.sig" "Quarry_${ARCH}.app.tar.gz.sig"
          gh release upload "$TAG" "Quarry_${ARCH}.app.tar.gz.sig" --clobber

      # Windows: same story as macOS above — tauri-action relocates/repacks the
      # NSIS installer before upload and the original .sig never survives (the
      # bundle dir ends up containing only the .exe, confirmed via diagnostics
      # in a prior run). Re-sign the final installer ourselves and upload that.
      - name: Re-sign Windows updater bundle
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          TAG="${{ github.ref_name }}"
          NSIS_DIR="src-tauri/target/release/bundle/nsis"

          BUNDLE=""
          for f in "$NSIS_DIR"/*setup.exe; do
            if [ -e "$f" ]; then
              BUNDLE="$f"
              break
            fi
          done

          if [ -z "$BUNDLE" ]; then
            echo "::error::Windows NSIS installer not found in $NSIS_DIR"
            ls -la "$NSIS_DIR" || true
            exit 1
          fi

          KEY=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\n\r')
          bunx tauri signer sign -k "$KEY" -p "" "$BUNDLE"

          cp "$BUNDLE.sig" "Quarry_x64-setup.exe.sig"
          gh release upload "$TAG" "Quarry_x64-setup.exe.sig" --clobber

  # Runs after all three build jobs. Downloads the .sig files uploaded above
  # and assembles the final latest.json that the in-app updater fetches.
  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/dawichi/quarrydb/releases/download/$TAG"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          mkdir /tmp/sigs
          gh release download "$TAG" \
            --repo dawichi/quarrydb \
            --pattern "*.sig" \
            --dir /tmp/sigs/ || true

          python3 - <<PYEOF
          import json, os

          sig_dir = "/tmp/sigs"
          base_url = "$BASE_URL"
          version  = "$VERSION"
          pub_date = "$PUB_DATE"

          def read_sig(name):
              path = os.path.join(sig_dir, name)
              return open(path).read().strip() if os.path.exists(path) else None

          platforms = {}

          aarch64_sig = read_sig("Quarry_aarch64.app.tar.gz.sig")
          if aarch64_sig:
              platforms["darwin-aarch64"] = {
                  "signature": aarch64_sig,
                  "url": f"{base_url}/Quarry_aarch64.app.tar.gz",
              }

          x64_mac_sig = read_sig("Quarry_x64.app.tar.gz.sig")
          if x64_mac_sig:
              platforms["darwin-x86_64"] = {
                  "signature": x64_mac_sig,
                  "url": f"{base_url}/Quarry_x64.app.tar.gz",
              }

          win_sig = read_sig("Quarry_x64-setup.exe.sig")
          if win_sig:
              platforms["windows-x86_64"] = {
                  "signature": win_sig,
                  "url": f"{base_url}/Quarry_{version}_x64-setup.exe",
              }

          payload = {
              "version": version,
              "notes": "See the full changelog in the commit history.\n\n**Install:** download the file for your platform below.\n**Auto-update:** if you already have Quarry installed, it will prompt you automatically.",
              "pub_date": pub_date,
              "platforms": platforms,
          }

          out = "/tmp/latest.json"
          with open(out, "w") as f:
              json.dump(payload, f, indent=2)

          print(f"Generated latest.json with platforms: {list(platforms.keys())}")
          print(open(out).read())
          PYEOF

          gh release upload "$TAG" /tmp/latest.json --clobber \
            --repo dawichi/quarrydb
