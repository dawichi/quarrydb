name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: quarry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy

      # Tauri's Linux build needs WebKitGTK; the keyring needs D-Bus.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Start MySQL and Redis
        run: docker compose -f docker-compose.local-test-services.yml up -d mysql redis

      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if docker exec quarry-mysql mysqladmin ping -h localhost -uroot -pquarry --silent; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Wait for Redis
        run: |
          for attempt in {1..30}; do
            if docker exec quarry-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Check formatting and lint
        run: |
          bun run check:ci
          bun run check:docs
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Policy and accepted advisories live in src-tauri/.cargo/audit.toml.
      - name: Audit dependencies
        run: bun run audit:dependencies

      - name: Run unit and integration tests
        env:
          QUARRY_MYSQL_INTEGRATION: '1'
        run: bun run test:run

      - name: Run native tests (with live MySQL and Redis)
        working-directory: src-tauri
        env:
          QUARRY_MYSQL_INTEGRATION: '1'
          QUARRY_REDIS_INTEGRATION: '1'
        run: cargo test

      - name: Run browser tests
        run: bun run test:e2e

      - name: Build production bundle
        run: bun run build

      - name: Build landing site
        run: bun run build:landing

      - name: Run landing browser tests
        run: bun run test:landing

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Stop provider test services
        if: always()
        run: docker compose -f docker-compose.local-test-services.yml down
