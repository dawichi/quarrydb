name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny unsound --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0235 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0190 --ignore RUSTSEC-2026-0221 --ignore RUSTSEC-2024-0429

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Start MySQL and Redis
        run: docker compose -f docker-compose.local-test-services.yml up -d mysql redis

      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if docker exec quarry-mysql mysqladmin ping -h localhost -uroot -pquarry --silent; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Wait for Redis
        run: |
          for attempt in {1..30}; do
            if docker exec quarry-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Check formatting and lint
        run: bun run check:ci && bun run check:docs

      - name: Audit dependencies
        run: bun run audit:dependencies

      - name: Run unit and integration tests
        run: bun run test:run && QUARRY_MYSQL_INTEGRATION=1 bun run vitest run src/app/core/integration/mysql-provider.integration.spec.ts

      - name: Run native Redis integration test
        working-directory: src-tauri
        env:
          QUARRY_REDIS_INTEGRATION: '1'
        run: cargo test exercises_the_native_provider_against_a_live_server_when_requested

      - name: Run browser tests
        run: bun run test:e2e

      - name: Build production bundle
        run: bun run build

      - name: Build landing site
        run: bun run build:landing

      - name: Run landing browser tests
        run: bun run test:landing

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Stop MySQL
        if: always()
        run: docker compose -f docker-compose.local-test-services.yml down
