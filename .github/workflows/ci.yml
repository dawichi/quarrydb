name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Start MySQL
        run: docker compose -f docker-compose.local-test-services.yml up -d mysql

      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if docker exec quarry-mysql mysqladmin ping -h localhost -uroot -pquarry --silent; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Check formatting and lint
        run: bun run check

      - name: Run unit and integration tests
        run: bun run test:run && QUARRY_MYSQL_INTEGRATION=1 bun run vitest run src/app/core/integration/mysql-provider.integration.spec.ts

      - name: Run browser tests
        run: bun run test:e2e

      - name: Build production bundle
        run: bun run build

      - name: Stop MySQL
        if: always()
        run: docker compose -f docker-compose.local-test-services.yml down
