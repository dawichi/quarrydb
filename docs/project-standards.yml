exceptions:
  - id: EXC-001
    rules: [API-001, API-002, API-003, API-004, API-005, API-006, API-007, API-008]
    rationale: Quarry has no public or independently deployed HTTP/RPC/event interface. Tauri IPC is a local privileged boundary assessed under security and runtime validation rules.
    owner: Quarry maintainers
    scope: current desktop application
    compensating_control: typed Tauri commands, explicit capability permissions, boundary tests, and local-only trust model
  - id: EXC-002
    rules: [IDN-001, IDN-002, IDN-003, IDN-004, IDN-005, IDN-006, IDN-007, IDN-008, IDN-009]
    rationale: Quarry has no user accounts, tenants, or application identity system.
    owner: Quarry maintainers
    scope: current desktop application and public landing site
    compensating_control: OS user permissions and provider-native database credentials

