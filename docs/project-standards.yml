project:
  name: quarrydb
  lifecycle: existing
  maturity: production-preview desktop application with SQLite, MySQL, and Redis providers

standards:
  - documentation
  - testing
  - typescript
  - styling
  - security
  - dependencies
  - ci-cd
  - data
  - operations
  - web

profiles:
  - angular-application
  - astro-website

scope_notes:
  - The Angular profile applies to the installed Tauri webview and its client-side workflows.
  - The Astro profile and rendered-page audits apply to landing/.
  - Accessibility rules apply to both rendered frontends; Lighthouse is scoped to the public landing site.
  - API, identity, Clerk, NestJS, Go, service health, and server shutdown rules are not applicable unless product scope changes.
  - Tauri IPC, filesystem, updater, keyring, SQLite, MySQL, and Redis boundaries are assessed under security, data, and operations rules.

