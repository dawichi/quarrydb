@if (tutorialSvc.step() >= 1 && tutorialSvc.step() <= 4 && current) {

    <div class="fixed top-6 right-6 z-50 w-80 rounded-xl border border-sky-500/30 bg-zinc-900/95 shadow-2xl backdrop-blur-sm">

        <!-- Progress dots -->
        <div class="flex items-center justify-between px-4 pt-3 pb-0">
            <div class="flex gap-1.5">
                @for (s of stepRange(); track s) {
                    <div
                        class="w-1.5 h-1.5 rounded-full transition-colors"
                        [class]="s <= tutorialSvc.step() ? 'bg-sky-500' : 'bg-zinc-700'"
                    ></div>
                }
            </div>
            <button
                type="button"
                class="text-xs text-zinc-600 hover:text-zinc-400 transition-colors"
                (click)="tutorialSvc.skip()"
            >
                Skip tutorial
            </button>
        </div>

        <!-- Content -->
        <div class="px-4 pt-2 pb-4">
            <p class="text-sm font-semibold text-zinc-100 mb-1">{{ current.title }}</p>
            <p class="text-xs text-zinc-400 leading-relaxed">{{ current.description }}</p>

            @if (current.hint && tutorialSvc.step() < 4) {
                <p class="mt-2 text-xs text-sky-500/60 italic">{{ current.hint }}</p>
            }

            @if (tutorialSvc.step() === 4) {
                <button
                    type="button"
                    class="mt-3 w-full py-1.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-zinc-950 text-sm font-semibold transition-colors"
                    (click)="tutorialSvc.finish()"
                >
                    Finish tutorial
                </button>
            }
        </div>
    </div>

}
