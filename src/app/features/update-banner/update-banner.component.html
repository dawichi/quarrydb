@if (!updaterSvc.modalStatus() && updaterSvc.pending(); as update) {

    <div class="fixed bottom-4 right-4 z-50 w-80 rounded-xl border border-sky-500/30 bg-zinc-900/95 shadow-2xl backdrop-blur-sm p-4">
        <div class="flex items-start justify-between gap-3 mb-3">
            <div>
                <p class="text-sm font-semibold text-zinc-100">Update available</p>
                <p class="text-xs text-zinc-400 mt-0.5">Quarry v{{ update.version }} is ready to install.</p>
            </div>
            <button
                type="button"
                class="flex-shrink-0 text-zinc-600 hover:text-zinc-400 transition-colors"
                (click)="updaterSvc.dismiss()"
                title="Dismiss"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <p class="text-xs text-zinc-600 mb-3">
            @if (update.releasedOn) {
                Released {{ update.releasedOn }} ·
            }
            <button
                type="button"
                class="text-sky-400 hover:text-sky-300 hover:underline underline-offset-2"
                (click)="updaterSvc.openReleaseNotes(update.version)"
            >
                View Release Notes
            </button>
        </p>

        <button
            type="button"
            class="w-full py-2 rounded-lg text-sm font-semibold bg-sky-500 hover:bg-sky-400 text-zinc-950 transition-colors"
            (click)="updaterSvc.installUpdate()"
        >
            Install and relaunch
        </button>

        <button
            type="button"
            class="mt-2 w-full text-center text-xs text-zinc-600 hover:text-zinc-400 transition-colors"
            (click)="updaterSvc.skipVersion(update.version)"
        >
            Skip this version
        </button>
    </div>

}
