@if (updaterSvc.pending(); as update) {

    <div class="fixed bottom-4 right-4 z-50 w-80 rounded-xl border border-sky-500/30 bg-zinc-900/95 shadow-2xl backdrop-blur-sm p-4">
        <div class="flex items-start justify-between gap-3 mb-3">
            <div>
                <p class="text-sm font-semibold text-zinc-100">Update available</p>
                <p class="text-xs text-zinc-400 mt-0.5">Quarry v{{ update.version }} is ready to install.</p>
            </div>
            <button
                type="button"
                class="flex-shrink-0 text-zinc-600 hover:text-zinc-400 transition-colors"
                (click)="updaterSvc.dismiss()"
                title="Dismiss"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        @if (update.notes) {
            <p class="text-xs text-zinc-500 mb-3 leading-relaxed line-clamp-3">{{ update.notes }}</p>
        }

        <button
            type="button"
            class="w-full py-2 rounded-lg text-sm font-semibold transition-colors flex items-center justify-center gap-2"
            [class]="updaterSvc.installing()
                ? 'bg-zinc-700 text-zinc-400 cursor-not-allowed'
                : 'bg-sky-500 hover:bg-sky-400 text-zinc-950'"
            [disabled]="updaterSvc.installing()"
            (click)="updaterSvc.installUpdate()"
        >
            @if (updaterSvc.installing()) {
                <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                Installing…
            } @else {
                Install and relaunch
            }
        </button>
    </div>

}
