[package]
name = "quarrydb"
version = "0.2.0"
description = "Visual query pipelines for SQLite and MySQL"
authors = ["David M. Fajardo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quarrydb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "mysql", "chrono"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false }
redis = { version = "1.5.0", default-features = false, features = ["json", "streams", "tls-rustls-webpki-roots"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
url = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
